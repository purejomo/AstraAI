appId: io.github.purejomo.astraai
productName: AstraAI
executableName: AstraAI
copyright: Copyright © purejomo
publish: null
asar: true
npmRebuild: false
directories:
  app: desktop
  output: release
  buildResources: desktop/assets
files:
  - main.mjs
  - runtime.mjs
  - package.json
  - LICENSE
  - assets/icon.png
  - "!node_modules/**"
extraResources:
  # Nest server/ so electron-builder does not exclude root node_modules.
  - from: .desktop
    to: .
    filter: ["server/**", "licenses/**"]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/assets/icon.ico
  artifactName: AstraAI-Setup-${version}-${arch}.${ext}
nsis:
  license: .desktop/licenses/AstraAI-LICENSE.txt
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AstraAI
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  installerLanguages: [ko_KR, en_US]
  language: 1042
linux:
  executableName: AstraAI
  icon: desktop/assets/icon.png
  category: Education
